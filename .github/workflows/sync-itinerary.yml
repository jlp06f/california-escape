name: Sync California Escape itinerary
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: california-escape-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate itinerary
        env:
          CALIFORNIA_API_URL: ${{ vars.CALIFORNIA_API_URL }}
        run: python3 scripts/sync_itinerary.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary.json
          if git diff --cached --quiet; then
            echo "No changes to itinerary.json"
          else
            git commit -m "Sync California Escape itinerary data"
            git push
          fi
